<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Selah live architecture</title>
  <desc id="description">A narrow dual-API flow from a synthetic draft through Gloo key selection, strict server validation, YouVersion exact text, and local display, with fail-open behavior on any mismatch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071427"/>
      <stop offset="0.58" stop-color="#0b1f35"/>
      <stop offset="1" stop-color="#201712"/>
    </linearGradient>
    <radialGradient id="glow" cx="74%" cy="24%" r="66%">
      <stop offset="0" stop-color="#f2b760" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2b760" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9a84d"/>
      <stop offset="1" stop-color="#ffe1a4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#eeb96b"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <circle cx="1132" cy="96" r="3" fill="#ffe1a4" opacity="0.85"/>
  <circle cx="1086" cy="142" r="2" fill="#ffe1a4" opacity="0.55"/>
  <circle cx="1190" cy="182" r="2.5" fill="#e9a84d" opacity="0.62"/>

  <g transform="translate(72 54)">
    <circle cx="25" cy="25" r="25" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <text x="25" y="34" text-anchor="middle" fill="#ffe5b7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="700">S</text>
    <text x="64" y="21" fill="#f6d79f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" letter-spacing="3">SELAH</text>
    <text x="64" y="43" fill="#8da2ba" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" letter-spacing="1.2">LIVE INTEGRATION · NARROW BY DESIGN</text>
  </g>

  <text x="72" y="166" fill="#f7f4ed" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="46" font-weight="650">Two APIs. One bounded decision.</text>
  <text x="72" y="207" fill="#a8b7c9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">The model never writes the reply or generates Scripture.</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" filter="url(#shadow)">
    <g transform="translate(72 276)">
      <rect width="190" height="148" rx="18" fill="#0d263f" stroke="#31506d"/>
      <text x="20" y="34" fill="#8198ae" font-size="12" font-weight="700" letter-spacing="1.5">LOCAL INPUT</text>
      <text x="20" y="70" fill="#f7f4ed" font-size="21" font-weight="650">Synthetic draft</text>
      <text x="20" y="98" fill="#f7f4ed" font-size="21" font-weight="650">+ chosen intent</text>
      <text x="20" y="128" fill="#9db0c4" font-size="13">No social connection</text>
    </g>

    <g transform="translate(304 276)">
      <rect width="190" height="148" rx="18" fill="#132d47" stroke="#d49b4c"/>
      <text x="20" y="34" fill="#f0bc72" font-size="12" font-weight="700" letter-spacing="1.5">GLOO AI</text>
      <text x="20" y="70" fill="#f7f4ed" font-size="21" font-weight="650">passage_key</text>
      <text x="20" y="98" fill="#f7f4ed" font-size="21" font-weight="650">question_key</text>
      <text x="20" y="128" fill="#9db0c4" font-size="13">Exactly two opaque enums</text>
    </g>

    <g transform="translate(536 276)">
      <rect width="208" height="148" rx="18" fill="#0e2b3b" stroke="#4a8b88"/>
      <text x="20" y="34" fill="#6fc4bd" font-size="12" font-weight="700" letter-spacing="1.5">LOCAL SERVER</text>
      <text x="20" y="69" fill="#f7f4ed" font-size="20" font-weight="650">Strict JSON</text>
      <text x="20" y="97" fill="#f7f4ed" font-size="20" font-weight="650">allowlist → USFM</text>
      <text x="20" y="128" fill="#9db0c4" font-size="13">Extra or unknown = reject</text>
    </g>

    <g transform="translate(786 276)">
      <rect width="190" height="148" rx="18" fill="#132d47" stroke="#d49b4c"/>
      <text x="20" y="34" fill="#f0bc72" font-size="12" font-weight="700" letter-spacing="1.5">YOUVERSION</text>
      <text x="20" y="69" fill="#f7f4ed" font-size="20" font-weight="650">Exact text</text>
      <text x="20" y="97" fill="#f7f4ed" font-size="20" font-weight="650">+ full attribution</text>
      <text x="20" y="128" fill="#9db0c4" font-size="13">ID must match request</text>
    </g>

    <g transform="translate(1018 276)">
      <rect width="190" height="148" rx="18" fill="#0d263f" stroke="#31506d"/>
      <text x="20" y="34" fill="#8198ae" font-size="12" font-weight="700" letter-spacing="1.5">LOCAL DISPLAY</text>
      <text x="20" y="70" fill="#f7f4ed" font-size="20" font-weight="650">Question + passage</text>
      <text x="20" y="98" fill="#f7f4ed" font-size="20" font-weight="650">No auto-post</text>
      <text x="20" y="128" fill="#9db0c4" font-size="13">The person chooses</text>
    </g>
  </g>

  <g stroke="#eeb96b" stroke-width="3" fill="#eeb96b" opacity="0.92">
    <path d="M267 350 H291"/><path d="M291 350 L281 344 L281 356 Z"/>
    <path d="M499 350 H523"/><path d="M523 350 L513 344 L513 356 Z"/>
    <path d="M749 350 H773"/><path d="M773 350 L763 344 L763 356 Z"/>
    <path d="M981 350 H1005"/><path d="M1005 350 L995 344 L995 356 Z"/>
  </g>

  <g transform="translate(72 486)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect width="1136" height="132" rx="22" fill="#171d28" stroke="#7d5d3d"/>
    <circle cx="56" cy="66" r="24" fill="#3b2921" stroke="#e4a75d"/>
    <path d="M45 66 H67 M56 55 V77" stroke="#ffd18d" stroke-width="3" stroke-linecap="round"/>
    <text x="98" y="52" fill="#f0bc72" font-size="13" font-weight="700" letter-spacing="1.8">ANY PROVIDER OR VALIDATION FAILURE</text>
    <text x="98" y="73" fill="#f7f4ed" font-size="23" font-weight="650">Fail open: show no verse, preserve the untouched draft, keep editing available.</text>
    <text x="98" y="104" fill="#9db0c4" font-size="14">No silent fallback · No invented text</text>
  </g>

  <text x="72" y="676" fill="#6f879e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" letter-spacing="1.2">FIXED HTTPS HOSTS · REDIRECT REFUSAL · BOUNDED RESPONSES · MEMORY-ONLY CREDENTIALS</text>
</svg>
